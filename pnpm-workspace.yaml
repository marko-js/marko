packages:
  - packages/*
linkWorkspacePackages: true
# Temporary: @zcov/*@0.1.2 published 2026-07-27, inside the 24h
# minimumReleaseAge window. Drop this block before merging.
minimumReleaseAgeExclude:
  - "@zcov/cli@0.1.2"
  - "@zcov/darwin-arm64@0.1.2"
  - "@zcov/darwin-x64@0.1.2"
  - "@zcov/freebsd-x64@0.1.2"
  - "@zcov/linux-arm64-gnu@0.1.2"
  - "@zcov/linux-arm64-musl@0.1.2"
  - "@zcov/linux-x64-gnu@0.1.2"
  - "@zcov/linux-x64-musl@0.1.2"
  - "@zcov/win32-arm64@0.1.2"
  - "@zcov/win32-x64@0.1.2"
patchedDependencies:
  "@babel/generator@7.29.7": patches/@babel__generator@7.29.7.patch
  "@babel/helper-compilation-targets@7.29.7": patches/@babel__helper-compilation-targets@7.29.7.patch
  "@babel/traverse@7.29.7": patches/@babel__traverse@7.29.7.patch
  "@babel/types@7.29.7": patches/@babel__types@7.29.7.patch
  mocha@11.7.6: patches/mocha@11.7.6.patch
  mocha-autotest@1.1.3: patches/mocha-autotest@1.1.3.patch
# The compiler resolves phantom workspace ids ("marko/translator",
# "@marko/runtime-tags/translator") from the repo root; hoist them into the
# root node_modules so that resolution works without pnpm's .bin-shim NODE_PATH.
publicHoistPattern:
  - marko
  - "@marko/runtime-tags"
